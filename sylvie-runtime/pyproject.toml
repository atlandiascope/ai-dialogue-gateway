[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sylvie-runtime"
version = "0.1.0"
description = "Provider-neutral, permission-conscious conversation runtime for Sylvie."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - evaluation preview" }
authors = [{ name = "AtlandiaScope" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sylvie_runtime"]
