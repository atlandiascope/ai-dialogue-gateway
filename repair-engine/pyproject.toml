[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "universal-ai-repair-engine"
version = "0.1.0"
description = "Workspace-scoped, approval-gated diagnostics and repair staging for Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - evaluation preview" }
authors = [{ name = "AtlandiaScope" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_ai_repair"]
