name: Repair Engine Tests

on:
  push:
    paths:
      - "repair-engine/**"
      - ".github/workflows/repair-engine-tests.yml"
  pull_request:
    paths:
      - "repair-engine/**"
      - ".github/workflows/repair-engine-tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK and test dependencies
        run: python -m pip install -e "./repair-engine[dev]"
      - name: Run tests
        run: python -m pytest -q repair-engine/tests
